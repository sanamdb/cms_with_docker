version: "3.8"
services:
  oracleDB:
    image: gvenzl/oracle-free:latest
    ports:
      - 1521:1521
    environment:
      ORACLE_PASSWORD: admin
      APP_USER: admin
      APP_USER_PASSWORD: admin
    volumes:
      - cms-volumes:/opt/oracle/oradata
      - ./docker_properties_seed.sql:/container-entrypoint-initdb.d/01_properties_seed.sql:ro
    networks:
      - cms-networks
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - 9092:9092
    volumes:
      - cms-kafka:/tmp/kraft-combined-logs
    networks:
      - cms-networks
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - cms-networks
    command:
      - /bin/sh
      - -c
      - >
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create
        --if-not-exists
        --topic college
        --partitions 1
        --replication-factor 1

  zipkin:
    image: openzipkin/zipkin:3.4.0
    ports:
      - 9411:9411
    networks:
      - cms-networks

  discovery-service:
    build: ./DiscoveryService
    profiles: ["discoveryApp"]
    ports:
      - 8761:8761
    networks:
      - cms-networks
    # depends_on:
    #   oracleDB:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  config-server:
    build: ./ConfigServer
    profiles: ["configApp"]
    ports:
      - 8888:8888
    networks:
      - cms-networks
    # depends_on:
    #   oracleDB:
    #     condition: service_healthy
    #   discovery-service:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  gateway-service:
    build: ./GatewayService
    profiles: ["gatewayApp"]
    ports:
      - 8443:8443
    networks:
      - cms-networks
    # depends_on:
    #   oracleDB:
    #     condition: service_healthy
    #   config-server:
    #     condition: service_healthy

  college-management:
    build: ./CollegeManagement
    profiles: ["apps"]
    ports:
      - 8080:8080
    networks:
      - cms-networks
    # depends_on:
    #   oracleDB:
    #     condition: service_healthy
    #   config-server:
    #     condition: service_healthy
    #   kafka:
    #     condition: service_healthy
    #   kafka-init:
    #     condition: service_completed_successfully

  exam-service:
    build: ./ExamService
    profiles: ["apps"]
    ports:
      - 8085:8085
    networks:
      - cms-networks
    # depends_on:
    #   oracleDB:
    #     condition: service_healthy
    #   config-server:
    #     condition: service_healthy

  notification-service:
    build: ./NotificationService
    profiles: ["apps"]
    ports:
      - 8082:8082
    networks:
      - cms-networks
    # depends_on:
    #   oracleDB:
    #     condition: service_healthy
    #   config-server:
    #     condition: service_healthy
    #   kafka:
    #     condition: service_healthy
    #   kafka-init:
    #     condition: service_completed_successfully

  question-service:
    build: ./QuestionService
    profiles: ["apps"]
    ports:
      - 8084:8084
    networks:
      - cms-networks
    # depends_on:
    #   oracleDB:
    #     condition: service_healthy
    #   config-server:
    #     condition: service_healthy

  student-service:
    build: ./StudentService
    profiles: ["apps"]
    ports:
      - 8083:8083
    networks:
      - cms-networks
    # depends_on:
    #   oracleDB:
    #     condition: service_healthy
    #   config-server:
    #     condition: service_healthy

  users-management-system:
    build: ./UsersManagementSystem
    profiles: ["apps"]
    ports:
      - 8081:8081
    networks:
      - cms-networks
    # depends_on:
    #   oracleDB:
    #     condition: service_healthy
    #   config-server:
    #     condition: service_healthy

networks:
  cms-networks:
    name: cms-networks
    driver: bridge

volumes:
  cms-volumes:
  cms-kafka: