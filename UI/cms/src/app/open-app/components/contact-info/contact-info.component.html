<div class="contact-card">
    <div class="icon-placeholder">
        <!-- A simple decorative dot since we don't have an icon library -->
        <span class="dot"></span>
    </div>
    <div class="contact-details">
        <div class="contact-type">{{ contactType }}</div>
        <div class="contact-value">{{ contactValue }}</div>
    </div>
</div>
