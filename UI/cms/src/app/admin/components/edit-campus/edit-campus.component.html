<div class="campus-form-container">
    <div *ngIf="success" class="alert alert-success">
        {{success}}
    </div>
    <h3 class="form-title">Add New Campus</h3>
    
    <form #campusFrm="ngForm" (ngSubmit)="updateCampus(campusFrm)">
        <p> <strong> Id: </strong> {{id}} </p>
        <div class="form-group">
            <label for="name">Campus Name</label>
            <input required minlength="3" maxlength="30" type="text" id="name" name="name" class="form-control" [(ngModel)]="campusForm.name"
                placeholder="Enter campus name" />
        </div>
        
        <div class="form-group">
            <label for="address">Campus Address</label>
            <input required pattern="^[a-zA-Z0-9 ,]{1,50}$" type="text" id="address" name="address" class="form-control" [(ngModel)]="campusForm.address"
                placeholder="Enter campus address" />
        </div>
        
        <div class="form-group">
            <label for="city">Select City</label>
            <select required id="city" name="city" class="form-control" [(ngModel)]="campusForm.city">
                <option [value]="selectedCity" disabled>{{selectedCity}}</option>
                <option *ngFor="let c of cityList" [value]="c">
                    {{c}}
                </option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary" [disabled]="campusFrm.invalid">Update Campus</button>
        </div>
    </form>
</div>
