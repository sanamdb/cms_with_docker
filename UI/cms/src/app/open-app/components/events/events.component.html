<div class="events-container">
  <!-- Use async pipe to subscribe and unwrap the array -->
  <ng-container *ngIf="events$ | async as events; else noEvents">
    
    <div class="event-card" *ngFor="let event of events">
      <!-- 
        Note: If your base64 string does NOT include the data prefix from the backend, 
        change the src to: [src]="'data:image/jpeg;base64,' + event.image" 
      -->
      
      <img [src]="'data:image/jpeg;base64,' + event.image" [alt]="event.title">

      <div class="event-details">
        <h3 class="event-title">{{ event.title }}</h3>
        <p class="event-description">{{ event.description }}</p>
      </div>
    </div>

  </ng-container>

  <ng-template #noEvents>
    <p class="empty-state">No events available at the moment.</p>
  </ng-template>
</div>
